# Como o Railway roda o Harvey.
#
# Fica aqui, no git, em vez de nos campos do painel: assim a configuração do
# worker é revisável no PR junto com o código que ele executa, e não some se
# alguém recriar o serviço.
#
# Só o serviço `harvey` é construído deste repo. O OS em si vive na Vercel.

[build]
builder = "NIXPACKS"
# Sem `next build`: o Harvey é um script `tsx`, e construir o app inteiro a cada
# deploy custaria minutos para produzir um `.next` que ninguém serve.
buildCommand = "echo 'sem build: o Harvey roda por tsx'"

[deploy]
# O mesmo ritmo do launchd que ele tinha no Mac: um ciclo, cinco minutos, outro
# ciclo. `|| true` porque um ciclo que morre não pode levar o worker com ele —
# é exatamente o que o launchd fazia ao reagendar mesmo depois de exit 1.
startCommand = "while true; do npm run harvey || true; sleep 300; done"
restartPolicyType = "ALWAYS"
